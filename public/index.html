<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光の板で国旗をつくろう</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>光の板で国旗をつくろう</h1>
  <div class="row">
    <button id="m-add" class="on">加法混色(光 R G B)</button>
    <button id="m-sub">減法混色(フィルター C M Y)</button>
  </div>
  <div class="row">
    <button id="t-stage" class="on">ステージ</button>
    <button id="t-free">フリー出題</button>
  </div>
  <section id="stageView">
    <h2 id="stageHead">ステージ選択</h2>
    <div id="stageGrid" class="grid"></div>
    <p class="note" id="stageNote"></p>
    <label class="note"><input type="checkbox" id="unlockAll"> 全ステージを開放する</label>
  </section>
  <section id="playView" hidden>
  <div class="row" id="freeBar">
    <select id="flagSel"></select>
    <button id="rand">おまかせ出題</button>
    <label class="note"><input type="checkbox" id="allFlags"> 簡略版も含む197か国</label>
  </div>
  <div class="row" id="stageBar">
    <button id="back">← ステージ選択</button><span id="stageInfo"></span>
  </div>
  <div id="q" class="q"></div>
  <canvas id="cv" tabindex="0"></canvas>
  <p class="note">板は単色で、形はいろいろです。穴(透明部分)があるのは、穴がないと旗にならない板だけ。板をドラッグで動かし、ボタンで回転・拡大縮小して、点線の枠(30×18)の中に国旗を完成させよう。回転と拡大縮小の中心は板の●印です。</p>
  <div id="chips" class="row"></div>
  <div class="row" id="tools">
    <button id="rotL90" title="左に90°">⟲90</button><button id="rotL15" title="左に15°">⟲15</button>
    <button id="rotR15" title="右に15°">15⟳</button><button id="rotR90" title="右に90°">90⟳</button>
    <button id="scDown" title="10%縮小">縮小−</button><button id="scUp" title="10%拡大">拡大＋</button>
  </div>
  <div class="row">
    <button id="check">答え合わせ(+1回)</button>
    <button id="hint">お手本を3秒表示(+3回)</button>
    <button id="reset">やり直す</button>
  </div>
  <div id="info" class="info"></div>
  <div id="refbox" class="refbox" hidden><canvas id="ref" width="300" height="180"></canvas></div>
  <section id="result" hidden>
    <div id="msg" class="msg"></div>
    <div class="row">
      <input id="name" maxlength="12" placeholder="名前(ランキング用)">
      <button id="send">記録を送る</button>
      <button id="next">次の国旗へ</button>
    </div>
  </section>
  <section>
    <h2>ランキング(操作回数が少ない順)</h2>
    <ol id="rank"></ol>
  </section>
  </section>
</main>
<script src="flags-data.js"></script>
<script src="game-core.js"></script>
<script src="client.js"></script>
</body>
</html>
